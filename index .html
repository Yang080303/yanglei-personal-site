<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b5bd6">
<title>杨蕾 · 个人介绍 | AI 应用 · 大模型实践</title>
<meta name="description" content="杨蕾的个人介绍 —— AI 应用 · 大模型实践 · 应用化学在读">
<script>
(function(){try{var t=localStorage.getItem('yl-theme');
if(!t){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}
document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<style>
/* ============ 主题变量 ============ */
:root{
  --bg:#f4f6fb;
  --card:rgba(255,255,255,.82);
  --card-solid:#ffffff;
  --nav-bg:rgba(244,246,251,.82);
  --text:#151a2d;
  --muted:#5c6780;
  --muted-2:#8a94aa;
  --line:rgba(21,26,45,.10);
  --primary:#5b5bd6;
  --primary-2:#0ea5b7;
  --accent:#e8a33d;
  --primary-soft:rgba(91,91,214,.10);
  --shadow:0 12px 32px -18px rgba(21,26,45,.35);
  --shadow-hi:0 22px 46px -20px rgba(21,26,45,.42);
  --radius:18px;
  --radius-sm:12px;
  --maxw:1080px;
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#0a0d16;
  --card:rgba(23,29,46,.74);
  --card-solid:#151b2b;
  --nav-bg:rgba(10,13,22,.78);
  --text:#e9eefc;
  --muted:#98a3bf;
  --muted-2:#6d7893;
  --line:rgba(255,255,255,.10);
  --primary:#8f90ff;
  --primary-2:#2dd4e0;
  --accent:#f2b95c;
  --primary-soft:rgba(143,144,255,.14);
  --shadow:0 12px 32px -18px rgba(0,0,0,.9);
  --shadow-hi:0 22px 46px -20px rgba(0,0,0,1);
  color-scheme:dark;
}

/* ============ 基础 ============ */
*,*::before,*::after{box-sizing:border-box}
html{
  background:var(--bg);
  scroll-behavior:smooth;
  scroll-padding-top:86px;
  -webkit-text-size-adjust:100%;
  transition:background-color .25s ease;
}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",sans-serif;
  color:var(--text);
  font-size:15.5px;
  line-height:1.72;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
  transition:color .25s ease;
}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{margin:0;line-height:1.3;font-weight:700;letter-spacing:-.01em}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:3px;border-radius:6px}

/* ============ 背景装饰 ============ */
.bg-decor{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg-decor::before,.bg-decor::after{
  content:"";position:absolute;width:46vmax;height:46vmax;border-radius:50%;
  filter:blur(90px);
}
.bg-decor::before{
  background:radial-gradient(circle at 35% 35%,var(--primary),transparent 65%);
  top:-20vmax;left:-16vmax;opacity:.30;
}
.bg-decor::after{
  background:radial-gradient(circle at 65% 65%,var(--primary-2),transparent 65%);
  bottom:-22vmax;right:-18vmax;opacity:.22;
}
[data-theme="dark"] .bg-decor::before{opacity:.34}
[data-theme="dark"] .bg-decor::after{opacity:.20}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(var(--line) 1px,transparent 1px),
    linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:56px 56px;
  -webkit-mask-image:radial-gradient(ellipse 80% 55% at 50% 0%,#000 5%,transparent 78%);
  mask-image:radial-gradient(ellipse 80% 55% at 50% 0%,#000 5%,transparent 78%);
  opacity:.55;
}

/* ============ 布局 ============ */
.wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 20px}
main{position:relative;z-index:1}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);
  transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease, background-color .25s ease;
}

/* ============ 导航 ============ */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:60;height:62px;
  background:var(--nav-bg);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
  backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid transparent;
  transition:border-color .25s ease,background-color .25s ease;
}
.nav.scrolled{border-bottom-color:var(--line)}
.nav-inner{height:100%;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;white-space:nowrap}
.brand-mark{
  width:28px;height:28px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:#fff;font-size:13px;font-weight:700;
  box-shadow:0 8px 16px -8px var(--primary);
}
.nav-links{display:flex;align-items:center;gap:2px}
.nav-link{
  padding:7px 12px;border-radius:10px;font-size:14px;color:var(--muted);
  transition:color .18s ease,background-color .18s ease;
}
.nav-link:hover{color:var(--text);background:var(--primary-soft)}
.nav-link.active{color:var(--primary);background:var(--primary-soft);font-weight:600}
.nav-actions{display:flex;align-items:center;gap:8px}
.icon-btn{
  width:38px;height:38px;border-radius:11px;border:1px solid var(--line);
  background:var(--card-solid);color:var(--text);
  display:inline-flex;align-items:center;justify-content:center;
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease,background-color .25s ease;
}
.icon-btn:hover{transform:translateY(-2px);border-color:var(--primary);box-shadow:var(--shadow)}
.icon-btn:active{transform:translateY(0) scale(.96)}
.icon-btn svg{width:18px;height:18px}

/* ============ Hero ============ */
.hero{padding:114px 0 22px}
.hero-card{
  padding:34px 32px 30px;position:relative;overflow:hidden;
  background-image:
    radial-gradient(520px 200px at 8% 0%,var(--primary-soft),transparent 70%),
    radial-gradient(420px 200px at 100% 110%,rgba(14,165,183,.12),transparent 70%);
}
.hero-top{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.avatar{
  width:64px;height:64px;flex:0 0 auto;border-radius:20px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:#fff;font-size:26px;font-weight:700;
  box-shadow:0 16px 30px -16px var(--primary);
}
.name{
  font-size:clamp(28px,4.6vw,40px);
  background:linear-gradient(100deg,var(--text) 26%,var(--primary) 72%,var(--primary-2) 100%);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
}
.role{margin-top:6px;color:var(--muted);font-size:14.5px}
.role b{color:var(--primary);font-weight:600}
.intro{margin-top:20px;color:var(--muted);font-size:14.5px;line-height:1.9;max-width:78ch}
.intro strong{color:var(--text);font-weight:600}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:600;
  background:var(--primary-soft);color:var(--primary);
  transition:transform .18s ease;
}
.badge:hover{transform:translateY(-2px)}
.badge.tiny{padding:2px 9px;font-size:11px}
.contacts{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 15px;border-radius:12px;font-size:13.5px;font-weight:600;
  border:1px solid var(--line);background:var(--card-solid);color:var(--text);
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,background-color .25s ease;
}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--primary)}
.btn:active{transform:translateY(0) scale(.98)}
.btn svg{width:16px;height:16px;flex:0 0 auto}
.btn .copy-hint{display:inline-flex;align-items:center;opacity:.35;transition:opacity .18s ease}
.btn .copy-hint svg{width:13px;height:13px}
.btn:hover .copy-hint{opacity:1}
.btn.static{cursor:default;color:var(--muted)}
.btn.static:hover{transform:none;box-shadow:none;border-color:var(--line)}
.btn.primary{
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:#fff;border-color:transparent;
  box-shadow:0 12px 26px -14px var(--primary);
}
.btn.primary:hover{box-shadow:0 18px 34px -14px var(--primary)}
.btn.copied{background:linear-gradient(135deg,#10b981,#059669);color:#fff;border-color:transparent}

/* ============ 区块 ============ */
.section{padding:32px 0}
.section-title{
  display:flex;align-items:center;gap:10px;
  font-size:19px;margin-bottom:18px;
}
.section-title::before{
  content:"";width:6px;height:20px;border-radius:3px;
  background:linear-gradient(180deg,var(--primary),var(--primary-2));
}

/* ============ 亮点 ============ */
.highlights{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.hl-card{padding:20px 20px 18px;position:relative;overflow:hidden}
.hl-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hi);border-color:var(--primary)}
.hl-num{
  font-size:30px;font-weight:800;letter-spacing:-.01em;line-height:1.1;
  background:linear-gradient(120deg,var(--primary),var(--primary-2));
  -webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
}
.hl-label{margin-top:6px;font-weight:600;font-size:14px;color:var(--text)}
.hl-desc{margin-top:8px;color:var(--muted);font-size:13px;line-height:1.7}

/* ============ Tabs ============ */
.tabs{
  display:flex;gap:6px;padding:6px;flex-wrap:wrap;
  border-radius:14px;border:1px solid var(--line);background:var(--card);
  box-shadow:var(--shadow);width:fit-content;margin-bottom:16px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
.tab{
  padding:8px 16px;border-radius:10px;
  font-size:13.5px;font-weight:600;color:var(--muted);
  transition:color .18s ease,background-color .18s ease,box-shadow .18s ease;
}
.tab:hover{color:var(--text);background:var(--primary-soft)}
.tab[aria-selected="true"]{
  color:#fff;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  box-shadow:0 12px 24px -14px var(--primary);
}
.tab-panel.panel-in{animation:panelIn .26s ease both}
@keyframes panelIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============ 经历卡片 ============ */
.exp-card{padding:22px;margin-bottom:14px}
.exp-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hi);border-color:var(--primary)}
.exp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.exp-title{font-size:16.5px}
.exp-role{margin-top:3px;color:var(--primary);font-weight:600;font-size:13.5px}
.chip.time{
  font-size:12.5px;color:var(--muted);background:var(--primary-soft);
  padding:4px 11px;border-radius:999px;white-space:nowrap;
}
.bullets{margin-top:14px;display:grid;gap:8px}
.bullets li{position:relative;padding-left:18px;color:var(--muted);font-size:13.8px;line-height:1.75}
.bullets li::before{
  content:"";position:absolute;left:2px;top:.72em;
  width:6px;height:6px;border-radius:50%;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
}
.bullets li b{color:var(--text);font-weight:600}

/* ============ 技能 ============ */
.skills-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.skill-group{padding:22px}
.skill-group:hover{box-shadow:var(--shadow-hi);border-color:var(--primary)}
.group-title{font-size:15px;margin-bottom:18px;display:flex;align-items:center;gap:9px}
.group-title::before{
  content:"";width:9px;height:9px;border-radius:3px;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
}
.skill{margin-bottom:15px}
.skill:last-child{margin-bottom:0}
.skill-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13.5px;margin-bottom:6px}
.skill-name{color:var(--text)}
.skill-level{color:var(--muted);font-size:11.5px;flex:0 0 auto;white-space:nowrap}
.bar{height:7px;border-radius:999px;background:var(--primary-soft);overflow:hidden}
.bar i{
  display:block;height:100%;width:0;border-radius:inherit;
  background:linear-gradient(90deg,var(--primary),var(--primary-2));
  transition:width .9s cubic-bezier(.22,.61,.36,1);
}
.skill.in .bar i{width:var(--w)}

/* ============ 教育时间线 ============ */
.timeline{position:relative;padding-left:26px}
.timeline::before{
  content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;
  background:linear-gradient(180deg,var(--primary),var(--primary-2),transparent);
  border-radius:2px;
}
.tl-item{position:relative;padding:20px;margin-bottom:14px}
.tl-item:hover{transform:translateY(-3px);box-shadow:var(--shadow-hi);border-color:var(--primary)}
.tl-item::before{
  content:"";position:absolute;left:-25px;top:26px;width:12px;height:12px;border-radius:50%;
  background:var(--card-solid);border:3px solid var(--primary);
  box-shadow:0 0 0 4px var(--primary-soft);
}

/* ============ 证书 ============ */
.certs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:14px}
.cert-card{
  padding:10px;display:flex;flex-direction:column;gap:10px;
  text-align:left;cursor:pointer;
}
.cert-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hi);border-color:var(--primary)}
.cert-thumb{
  aspect-ratio:4/3;border-radius:12px;overflow:hidden;position:relative;
  display:grid;place-items:center;
  background:linear-gradient(135deg,var(--primary-soft),rgba(14,165,183,.14));
}
.cert-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease}
.cert-card:hover .cert-thumb img{transform:scale(1.06)}
.cert-fallback{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;width:100%;height:100%;padding:12px;text-align:center;
  color:var(--primary);
}
.cert-fallback svg{width:38px;height:38px;opacity:.7}
.cert-fallback span{font-size:12px;font-weight:600;line-height:1.4;word-break:break-all}
.cert-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px 4px}
.cert-title{font-size:13.5px;font-weight:600;line-height:1.4}
.award-list{margin-top:16px;padding:18px 22px;display:grid;gap:10px}
.award-row{display:flex;align-items:flex-start;gap:10px;color:var(--muted);font-size:13.5px}
.award-dot{
  width:7px;height:7px;border-radius:50%;margin-top:.65em;flex:0 0 auto;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
}

/* ============ 页脚 ============ */
.footer{position:relative;z-index:1;padding:44px 0 64px;text-align:center;color:var(--muted);font-size:13px}
.footer-sub{margin-top:6px;font-size:12px;opacity:.75}

/* ============ 返回顶部 / Toast ============ */
.totop{
  position:fixed;right:22px;bottom:22px;z-index:55;
  width:44px;height:44px;border-radius:14px;cursor:pointer;
  border:1px solid var(--line);background:var(--card-solid);color:var(--text);
  display:grid;place-items:center;box-shadow:var(--shadow);
  opacity:0;visibility:hidden;transform:translateY(10px);
  transition:opacity .22s ease,transform .22s ease,visibility .22s,border-color .18s ease;
}
.totop:hover{border-color:var(--primary);transform:translateY(-3px)}
.totop.show{opacity:1;visibility:visible;transform:translateY(0)}
.totop svg{width:20px;height:20px}
.toast{
  position:fixed;left:50%;bottom:34px;z-index:120;
  padding:11px 20px;border-radius:12px;font-size:13.5px;
  background:var(--card-solid);border:1px solid var(--line);box-shadow:var(--shadow-hi);
  opacity:0;visibility:hidden;transform:translate(-50%,14px);
  transition:opacity .22s ease,transform .22s ease,visibility .22s;
  max-width:min(90vw,460px);text-align:center;
}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}

/* ============ 灯箱 ============ */
.lightbox{
  position:fixed;inset:0;z-index:100;padding:24px;
  display:grid;place-items:center;
  background:rgba(8,10,18,.82);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  animation:lbIn .2s ease both;
}
.lightbox[hidden]{display:none}
@keyframes lbIn{from{opacity:0}to{opacity:1}}
.lb-inner{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:100%}
.lightbox img{
  max-width:min(92vw,900px);max-height:74vh;width:auto;height:auto;
  object-fit:contain;border-radius:14px;
  box-shadow:0 30px 70px -20px rgba(0,0,0,.85);
  background:#fff;
}
.lb-fallback{
  width:min(80vw,420px);aspect-ratio:4/3;border-radius:14px;
  display:grid;place-items:center;text-align:center;padding:24px;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:#fff;font-size:14px;font-weight:600;
  box-shadow:0 30px 70px -20px rgba(0,0,0,.85);
}
.lb-caption{color:#fff;font-size:13.5px;opacity:.88;text-align:center}
.lb-close{
  position:absolute;top:18px;right:22px;
  width:42px;height:42px;border-radius:12px;cursor:pointer;
  border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.10);
  color:#fff;font-size:24px;line-height:1;display:grid;place-items:center;
  transition:background-color .18s ease,transform .18s ease;
}
.lb-close:hover{background:rgba(255,255,255,.22);transform:rotate(90deg)}

/* ============ 入场动画 ============ */
.reveal{opacity:0;transform:translateY(16px);transition:opacity .5s ease,transform .5s ease}
.reveal.in{opacity:1;transform:none}

/* ============ 响应式 ============ */
@media (max-width:900px){ .nav-links{display:none} }
@media (max-width:640px){
  body{font-size:15px}
  .hero{padding-top:96px}
  .hero-card{padding:26px 20px 24px}
  .avatar{width:54px;height:54px;border-radius:17px;font-size:22px}
  .section{padding:26px 0}
  .highlights{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .certs-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .skills-grid{grid-template-columns:1fr}
  .contacts{gap:8px}
  .btn{padding:9px 12px;font-size:13px}
  .totop{right:16px;bottom:16px}
}

/* ============ 减弱动画 ============ */
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
  }
  .reveal{opacity:1;transform:none}
  .skill .bar i{width:var(--w)}
}

/* ============ 打印 ============ */
@media print{
  :root,[data-theme="dark"],[data-theme="light"]{
    --bg:#ffffff;--card:#ffffff;--card-solid:#ffffff;
    --nav-bg:#ffffff;--text:#000000;--muted:#333333;--muted-2:#555555;
    --line:#e2e2e2;--primary:#3b3bb0;--primary-soft:#f0f0fa;
    --primary-2:#0b7f8c;--shadow:none;--shadow-hi:none;
    color-scheme:light;
  }
  html,body{background:#fff !important;color:#000 !important;font-size:11.8pt}
  .bg-decor,body::before,.nav,.totop,.toast,.lightbox{display:none !important}
  main{position:static}
  .hero{padding:0 0 14px}
  .card{
    box-shadow:none !important;
    border:1px solid #e4e4e4 !important;
    background:#fff !important;
    -webkit-backdrop-filter:none !important;
    backdrop-filter:none !important;
  }
  .tabs{display:none !important}
  .tab-panel{display:block !important;animation:none !important}
  .tab-panel[hidden]{display:block !important}
  .tab-panel + .tab-panel{margin-top:12px}
  .section{padding:12px 0;break-inside:avoid}
  .exp-card,.tl-item,.hl-card,.cert-card,.skill-group{break-inside:avoid;page-break-inside:avoid}
  .hl-card:hover,.exp-card:hover,.tl-item:hover,.cert-card:hover,.skill-group:hover{transform:none !important}
  .cert-thumb{aspect-ratio:auto;height:auto;min-height:70px}
  .cert-thumb img{height:110px;object-fit:contain}
  .certs-grid{grid-template-columns:repeat(4,1fr);gap:8px}
  .highlights{grid-template-columns:repeat(3,1fr)}
  .reveal{opacity:1 !important;transform:none !important}
  .skill .bar i{width:var(--w) !important}

  var reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

    var node = document.createElement(tag);
    if (attrs){
      for (var k in attrs){
        if (!Object.prototype.hasOwnProperty.call(attrs,k)) continue;
        var v = attrs[k];
        if (v === null || v === undefined || v === false) continue;
        if (k === 'class') node.className = v;
        else if (k === 'text') node.textContent = v;
        else if (k === 'html') node.innerHTML = v;
        else if (k === 'style') node.setAttribute('style', v);
        else if (k.indexOf('on') === 0 && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
        else node.setAttribute(k, v);
      }
    }
    if (children !== null && children !== undefined){
      var arr = Array.isArray(children) ? children : [children];
      arr.forEach(function(c){
        if (c === null || c === undefined || c === false) return;
        node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
      });
    }
    return node;
  }

    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }
  function copyText(text, msg){
    function fallback(){
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly','');
      ta.style.cssText = 'position:fixed;top:-1000px;left:-1000px;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = false;
      try { ok = document.execCommand('copy'); } catch(e){ ok = false; }
      document.body.removeChild(ta);
      toast(ok ? msg : ('复制失败，请手动复制：' + text));
    }
    if (navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(function(){ toast(msg); }, fallback);
    } else fallback();
  }

  /* ================= Tabs 通用 ================= */
  function buildTabs(tabsData, ariaLabel){
    var wrapEl = el('div');
    var tablist = el('div', {class:'tabs', role:'tablist', 'aria-label':ariaLabel||'内容分类'});
    var panels = el('div', {class:'panels'});
    var btns = [];

    function select(i, focus){
      btns.forEach(function(b, j){
        var on = (i === j);
        b.setAttribute('aria-selected', on ? 'true' : 'false');
        b.tabIndex = on ? 0 : -1;
        panels.children[j].hidden = !on;
      });
      var p = panels.children[i];
      if (p && !reduceMotion){
        p.classList.remove('panel-in');
        void p.offsetWidth;
        p.classList.add('panel-in');
      }
      if (focus) btns[i].focus();
    }

    tabsData.forEach(function(t, i){
      var btn = el('button', {
        class:'tab', type:'button', role:'tab',
        id:'tab-'+t.id,
        'aria-controls':'panel-'+t.id,
        'aria-selected': i===0 ? 'true' : 'false',
        tabindex: i===0 ? '0' : '-1',
        text:t.label
      });
      btn.addEventListener('click', function(){ select(i,false); });
      btn.addEventListener('keydown', function(e){
        var n = tabsData.length, idx = null;
        if (e.key === 'ArrowRight') idx = (i+1)%n;
        else if (e.key === 'ArrowLeft') idx = (i-1+n)%n;
        else if (e.key === 'Home') idx = 0;
        else if (e.key === 'End')  idx = n-1;
        if (idx !== null){ e.preventDefault(); select(idx,true); }
      });
      btns.push(btn);
      tablist.appendChild(btn);

      var panel = el('div', {
        class:'tab-panel', role:'tabpanel',
        id:'panel-'+t.id, 'aria-labelledby':'tab-'+t.id, tabindex:'0'
      });
      if (i !== 0) panel.hidden = true;
      panel.appendChild(t.content);
      panels.appendChild(panel);
    });

    if (tabsData.length < 2) tablist.style.display = 'none';
    wrapEl.appendChild(tablist);
    wrapEl.appendChild(panels);
    return wrapEl;
  }

        var skill = el('div', {class:'skill'});
        var row = el('div', {class:'skill-row'}, [
          el('span', {class:'skill-name', text:it.name}),
          el('span', {class:'skill-level', text:it.note || levelText(it.level)})
        ]);
        var bar = el('div', {class:'bar', 'aria-hidden':'true'}, [
          el('i', {style:'--w:'+it.level+'%'})
        ]);
        skill.appendChild(row);
        skill.appendChild(bar);
        list.appendChild(skill);
      });
      card.appendChild(list);
      grid.appendChild(card);
    });
  }

  /* ================= 教育 ================= */
  function renderEducation(){
    var box = byId('edu-list');
    var sec = byId('education');
    if (!box || !sec) return;
    if (!resume.education || !resume.education.length){ sec.hidden = true; return; }
    resume.education.forEach(function(e){
      var item = el('article', {class:'card tl-item reveal'});
      var head = el('div', {class:'exp-head'});
      var left = el('div', {});
      left.appendChild(el('h3', {class:'exp-title', text:e.school}));
      if (e.major) left.appendChild(el('p', {class:'exp-role', text:e.major}));
      head.appendChild(left);
      if (e.time) head.appendChild(el('span', {class:'chip time', text:e.time}));
      item.appendChild(head);
      if (e.points && e.points.length){
        var ul = el('ul', {class:'bullets'});
        e.points.forEach(function(p){ ul.appendChild(el('li', {text:p})); });
        item.appendChild(ul);
      }
      box.appendChild(item);
    });
  }

  /* ================= 证书 ================= */
  function makeFallback(title){
    var box = el('div', {class:'cert-fallback'});
    box.innerHTML = ICON.award;
    box.appendChild(el('span', {text:title}));
    return box;
  }

  function openLightbox(cert, srcOverride){
    var lb = byId('lightbox');
    var inner = byId('lbInner');
    var cap = byId('lbCaption');
    if (!lb || !inner) return;

    // 清掉上一次的内容
    var oldImg = byId('lbImg');
    if (oldImg) oldImg.remove();
    var oldFb = inner.querySelector('.lb-fallback');
    if (oldFb) oldFb.remove();

    if (srcOverride){
      var img = el('img', {id:'lbImg', src:srcOverride, alt:cert.title});
      img.addEventListener('error', function(){
        img.remove();
        inner.insertBefore(el('div', {class:'lb-fallback', text:cert.title + '（图片待补充）'}), cap);
      });
      inner.insertBefore(img, cap);
    } else {
      inner.insertBefore(el('div', {class:'lb-fallback', text:cert.title + '（图片待补充）'}), cap);
    }
    cap.textContent = cert.title;
    lb.hidden = false;
    document.body.style.overflow = 'hidden';
    var closeBtn = byId('lbClose');
    if (closeBtn) closeBtn.focus();
  }

  function closeLightbox(){
    var lb = byId('lightbox');
    if (!lb || lb.hidden) return;
    lb.hidden = true;
    document.body.style.overflow = '';
  }

  function renderCerts(){
    var grid = byId('certs-grid');
    var awardBox = byId('award-list');
    var sec = byId('certs');
    if (!grid || !awardBox || !sec) return;

    var certs = resume.certificates || [];
    var awards = resume.awards || [];

    if (!certs.length && !awards.length){ sec.hidden = true; return; }

    certs.forEach(function(c){
      var card = el('button', {
        class:'cert-card card reveal',
        type:'button',
        'aria-label':'查看大图：' + c.title
      });

      var thumb = el('div', {class:'cert-thumb'});
      var img = el('img', {
        alt:c.title,
        loading:'lazy', decoding:'async'
      });

      var candidates = c.candidates || [];
      var idx = 0;
      var loaded = false;

      function tryNext(){
        if (loaded) return;
        if (idx >= candidates.length){
          img.remove();
          thumb.appendChild(makeFallback(c.title));
          card.setAttribute('data-noimg', '1');
          return;
        }
        img.src = candidates[idx++];
      }

      img.addEventListener('load', function(){
        if (img.naturalWidth > 0) loaded = true;
      });
      img.addEventListener('error', tryNext);

      thumb.appendChild(img);
      card.appendChild(thumb);

      // 开始尝试
      tryNext();

      var meta = el('div', {class:'cert-meta'});
      meta.appendChild(el('span', {class:'cert-title', text:c.title}));
      if (c.tag) meta.appendChild(el('span', {class:'badge tiny', text:c.tag}));
      card.appendChild(meta);

      card.addEventListener('click', function(){
        var hasImage = !card.hasAttribute('data-noimg');
        var src = hasImage ? img.getAttribute('src') : null;
        openLightbox(c, src);
      });

      grid.appendChild(card);
    });

    if (awards.length){
      awards.forEach(function(a){
        var row = el('div', {class:'award-row'});
        row.appendChild(el('span', {class:'award-dot', 'aria-hidden':'true'}));
        row.appendChild(el('span', {text:a}));
        awardBox.appendChild(row);
      });
    } else {
      awardBox.hidden = true;
    }
  }

  /* ================= 主题 ================= */
  function currentTheme(){
    return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  }
  function applyThemeIcon(){
    var btn = byId('themeBtn');
    if (btn) btn.innerHTML = currentTheme() === 'dark' ? ICON.sun : ICON.moon;
  }
  function setupTheme(){
    var btn = byId('themeBtn');
    if (!btn) return;
    applyThemeIcon();
    btn.addEventListener('click', function(){
      var next = currentTheme() === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('yl-theme', next); } catch(e){}
      applyThemeIcon();
    });
  }

  /* ================= 导航 ================= */
  function setupNav(){
    var nav = byId('nav');
    var toTop = byId('toTop');
    var links = Array.prototype.slice.call(document.querySelectorAll('.nav-link'));

    function onScroll(){
      var y = window.pageYOffset || document.documentElement.scrollTop;
      if (nav) nav.classList.toggle('scrolled', y > 8);
      if (toTop) toTop.classList.toggle('show', y > 420);
    }
    window.addEventListener('scroll', onScroll, {passive:true});
    onScroll();

    if (toTop){
      toTop.innerHTML = ICON.up;
      toTop.addEventListener('click', function(){
        window.scrollTo({top:0, behavior: reduceMotion ? 'auto' : 'smooth'});
      });
    }

    if ('IntersectionObserver' in window && links.length){
      var map = {}, targets = [];
      links.forEach(function(l){
        var href = l.getAttribute('href');
        if (!href || href.charAt(0) !== '#') return;
        var node = document.querySelector(href);
        if (node){ map[node.id] = l; targets.push(node); }
      });
      var spy = new IntersectionObserver(function(entries){
        entries.forEach(function(en){
          if (!en.isIntersecting) return;
          links.forEach(function(l){ l.classList.remove('active'); });
          var active = map[en.target.id];
          if (active) active.classList.add('active');
        });
      }, {rootMargin:'-45% 0px -50% 0px', threshold:0});
      targets.forEach(function(t){ spy.observe(t); });
    }
  }

  /* ================= 入场动画 ================= */
  function setupReveal(){
    var reveals = Array.prototype.slice.call(document.querySelectorAll('.reveal'));
    var skills  = Array.prototype.slice.call(document.querySelectorAll('.skill'));

    if (reduceMotion || !('IntersectionObserver' in window)){
      reveals.forEach(function(n){ n.classList.add('in'); });
      skills.forEach(function(n){ n.classList.add('in'); });
      return;
    }

    var io = new IntersectionObserver(function(entries, obs){
      entries.forEach(function(en){
        if (en.isIntersecting){
          en.target.classList.add('in');
          obs.unobserve(en.target);
        }
      });
    }, {threshold:0.12, rootMargin:'0px 0px -40px 0px'});

    reveals.forEach(function(n, i){
      n.style.transitionDelay = (Math.min(i % 6, 5) * 45) + 'ms';
      io.observe(n);
    });
    skills.forEach(function(n, i){
      n.style.transitionDelay = (Math.min(i % 7, 6) * 60) + 'ms';
      io.observe(n);
    });
  }

  /* ================= 打印 & 灯箱 ================= */
  function setupPrint(){
    var btn = byId('printBtn');
    if (!btn) return;
    btn.innerHTML = ICON.print;
    btn.addEventListener('click', function(){ window.print(); });
  }

  function setupLightbox(){
    var lb = byId('lightbox');
    var closeBtn = byId('lbClose');
    if (!lb) return;
    if (closeBtn) closeBtn.addEventListener('click', closeLightbox);
    lb.addEventListener('click', function(e){ if (e.target === lb) closeLightbox(); });
    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape' && !lb.hidden) closeLightbox();
    });
  }

  /* ================= 初始化 ================= */
  function init(){
    var yearEl = byId('year');
    if (yearEl) yearEl.textContent = new Date().getFullYear();

    setupTheme();
    setupPrint();

    renderHero();
    renderHighlights();
    renderExperience();
    renderSkills();
    renderEducation();
    renderCerts();

    setupNav();
    setupLightbox();
    setupReveal();
  }

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else init();
})();
</script>
</body>
</html>
